; ============================================================
;   工位预警软件 - 配置文件
; ------------------------------------------------------------
;   一般不用手改本文件！
;   想改设置：在屏幕上按【隐藏热键】呼出设置窗口，点鼠标就行。
; ============================================================

[网络]
; 广播端口，所有同事必须一致（1024~65535）
Port = 17891


[宠物]
; 可选：wolf / poop / bear / pig / frog / skull
NormalPet = frog
UrgentPet = skull


[外观]
; 图标大小（像素 60~200）
Size = 120
; 普通预警停留时间（毫秒）
NormalDurationMs = 3000
; 紧急预警停留时间（毫秒）
UrgentDurationMs = 6000
; 解除提示停留时间（毫秒）
ClearDurationMs = 1200
; 宠物出现的角落：
;   bottomright  右下角（默认）
;   bottomleft   左下角
;   topright     右上角
;   topleft      左上角
Corner = bottomright


[快捷键]
; 三个预警热键 + 一个"打开设置窗口"的隐藏热键
; 格式：ctrl+alt+字母，支持 shift
HotkeyNormal = ctrl+alt+l
HotkeyUrgent = ctrl+alt+k
HotkeyClear  = ctrl+alt+j
; 这个是"老板键"——只有你们自己人知道，用来呼出设置窗口
HotkeySettings = ctrl+alt+shift+s


[高级]
; 防连按冷却（毫秒）
CooldownMs = 2000
; 提示音（true/false）
SoundOn = false
; 开机自启（true/false）
AutoStart = false
